name: Ruijie Scanner Bot

on:
  repository_dispatch:
    types: [start_scanner]
  workflow_dispatch:
    inputs:
      portal_url:
        description: 'Ruijie Portal URL'
        required: true
        default: 'http://example.com/portal'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run scanner script
      env:
        PORTAL_URL: ${{ github.event.client_payload.portal_url || github.event.inputs.portal_url }}
      run: python scanner.py
      
